name: Verify inventory service
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest -q
      - run: docker build -t stockroom .
      - name: Exercise container
        run: |
          docker run -d --name stockroom -p 127.0.0.1:8000:8000 stockroom
          curl -fsS --retry 10 --retry-delay 1 --retry-connrefused http://localhost:8000/inventory | python -c "import json,sys; assert json.load(sys.stdin)[0]['available']==20"
