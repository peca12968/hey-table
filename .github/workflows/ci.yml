name: Check commit boundaries against SQLite recovery
on: [push, pull_request]
permissions:
  contents: read
jobs:
  recover:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - run: go vet ./...
      - run: go build -o wal-lantern.exe .
      - run: python replay_demo.py wal-lantern.exe
