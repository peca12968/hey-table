name: Verify reconciliation
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/checkout@v4
        with:
          repository: peca12968/hey-table
          ref: e0596f05039ff0520bfb1207c20fee05c1e7894b
          path: hey-table
          sparse-checkout: drizzle
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: peca12968/remit-match
          ref: ec46694f1774e9a4e625d929f4e9c6db95ce14a6
          path: remit-match
          persist-credentials: false
      - run: python -m unittest -v
        env:
          HEY_TABLE_MIGRATIONS: hey-table/drizzle
          REMIT_MATCH_DIR: remit-match
      - run: python ledger.py examples/orders.csv examples/postings.csv
      - name: Explain the USD difference between the sample snapshots
        run: |
          python ledger.py examples/orders.csv examples/postings.csv --db "$RUNNER_TEMP/demo.db" > /dev/null
          python ledger.py examples/orders.csv examples/postings-followup.csv --db "$RUNNER_TEMP/demo.db" --explain > "$RUNNER_TEMP/report.json"
          jq -e '.movements_by_currency.USD | select([.opening_delta_minor, .change_minor, .closing_delta_minor] == [-3150, 700, -2450])' "$RUNNER_TEMP/report.json"
