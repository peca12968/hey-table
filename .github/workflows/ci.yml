name: Verify incremental backups
on: [push, pull_request]
permissions:
  contents: read
jobs:
  backup:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python -m unittest -v
      - run: python demo.py
