name: Verify manifest streaming and atomic publication
on: [push, pull_request]
permissions:
  contents: read
jobs:
  transfer:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: "python -m pip install --only-binary=:all: -r requirements.txt"
      - run: python -m grpc_tools.protoc -I . --python_out=. --grpc_python_out=. manifest.proto
      - run: python -m unittest -v
