name: Verify dispatch planning and Stockroom replay
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: python -m unittest -v
      - uses: actions/checkout@v7
        with:
          repository: peca12968/stockroom-reservations
          ref: 7b6a21c3e94f0ce44f9a179ea6a223150ecb7967
          path: stockroom-upstream
          persist-credentials: false
      - run: python -m pip install -r stockroom-upstream/requirements-dev.txt
      - run: python demo.py stockroom-upstream
