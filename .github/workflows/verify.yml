name: Verify partial returns against restaurant receipts
on: [push, pull_request]
permissions:
  contents: read
jobs:
  returns:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - uses: actions/checkout@v7
        with:
          repository: peca12968/table-shares
          ref: 91ff344a99838d91906d90328ac31f2533da1407
          path: table-shares
          persist-credentials: false
      - run: python -m unittest -v
        env:
          TABLE_SHARES_DIR: table-shares
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - uses: actions/checkout@v7
        with:
          repository: peca12968/hey-table
          ref: b93c0850bba0ce3350acffad5426b137953721b6
          path: hey-table
          persist-credentials: false
      - run: npm ci --include=optional
        working-directory: hey-table
      - run: node demo.mjs hey-table
