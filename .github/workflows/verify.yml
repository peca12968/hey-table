name: Verify signed Stockroom handoff
on: [push, pull_request]
permissions:
  contents: read
jobs:
  handoff:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: dotnet build -c Release
      - run: openssl version
        if: runner.os == 'Linux'
      - run: python -m unittest -v
      - uses: actions/checkout@v7
        with:
          repository: peca12968/stockroom-reservations
          ref: dca1d863b07e2a14c9e79b62453886cd3c8b8866
          path: stockroom-upstream
          persist-credentials: false
      - run: python -m pip install -r stockroom-upstream/requirements-dev.txt
      - run: python demo.py stockroom-upstream
