name: Verify opening float and real checkout replay
on: [push, pull_request]
permissions:
  contents: read
jobs:
  plan:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest -v
      - uses: actions/checkout@v7
        with:
          repository: peca12968/till-change
          ref: 210ec2967f8c1394849fd68ae183c98d075ba9c8
          path: till-change
          persist-credentials: false
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'
      - run: python compare_register.py till-change
