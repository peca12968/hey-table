name: Verify whole-unit bill sharing
on: [push, pull_request]
permissions:
  contents: read
jobs:
  split:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - uses: actions/checkout@v7
        with:
          repository: peca12968/hey-table
          ref: 280603cddd54b7400c07374d45c8723c9bd0a915
          path: hey-table
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: hey-table/package-lock.json
      - uses: actions/checkout@v7
        with:
          repository: peca12968/combo-counter
          ref: 25fbf7ae239c8ca8c465588b0fe8ab1756a04ff9
          path: combo-counter
          persist-credentials: false
      - run: python -m unittest -v
        env:
          COMBO_PROJECT: combo-counter
      - run: npm ci --prefix hey-table --include=optional
      - run: node table-demo.mjs hey-table combo-counter
