name: Verify recorded payment deadlines
on: [push, pull_request]
permissions:
  contents: read
jobs:
  check:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python -m unittest -v
      - uses: actions/checkout@v7
        with:
          repository: peca12968/hey-table
          ref: 93a419a680280410c8b07a4c376bd541fa50ebb5
          path: hey-table
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - run: npm ci --include=optional
        working-directory: hey-table
      - run: node demo.mjs hey-table
