name: Replay process loss across commit and expiry
on: [push, pull_request]
permissions:
  contents: read
jobs:
  crash:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/checkout@v7
        with:
          repository: peca12968/hey-table
          ref: 34165f1adceb2baceaa53997b7a79a86656e959b
          path: stockroom-src
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python -m pip install -r stockroom-src/requirements.txt
      - run: python drill.py stockroom-src
