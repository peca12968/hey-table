name: Check station handoff and interrupted delivery
on: [push, pull_request]
permissions:
  contents: read
jobs:
  rail:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: python -m unittest -v
      - uses: actions/checkout@v7
        with:
          repository: peca12968/hey-table
          ref: 704617a3b3b02dff6ec10265aba04ddb8217a9a3
          path: hey-table
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: hey-table/package-lock.json
      - run: npm ci --prefix hey-table --include=optional
      - run: node kitchen-demo.mjs hey-table
