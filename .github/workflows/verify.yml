name: Verify kitchen inventory cost close
on: [push, pull_request]
permissions:
  contents: read
jobs:
  close:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: python -m unittest -v
      - uses: actions/checkout@v7
        with:
          repository: peca12968/prep-sheet
          ref: 00e56da3bf47a32819652a69bdcc9862fa6f56e7
          path: prep-sheet
          persist-credentials: false
      - run: python demo.py prep-sheet
