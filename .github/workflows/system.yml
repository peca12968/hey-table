name: Verify hey-table system
'on':
- push
- pull_request
permissions:
  contents: read
jobs:
  ordering:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    - uses: actions/setup-node@v6
      with:
        node-version: '24'
        cache: npm
    - uses: actions/setup-python@v7
      with:
        python-version: '3.12'
    - run: npm ci --include=optional
    - run: node --test qa/tappay.test.mjs
    - run: npm run build
    - run: npm ci --prefix qa
    - run: npx playwright install --with-deps chromium
      working-directory: qa
    - run: npx playwright test
      working-directory: qa
    - run: python -m pip install -r modules/table-scan-check/requirements.txt
    - run: python scripts/verify-operations.py tables
  operations:
    strategy:
      matrix:
        os:
        - ubuntu-latest
        - windows-latest
    runs-on: ${{ matrix.os }}
    steps:
    - uses: actions/checkout@v7
    - uses: actions/setup-node@v6
      with:
        node-version: '24'
        cache: npm
    - uses: actions/setup-python@v7
      with:
        python-version: '3.12'
    - uses: actions/setup-dotnet@v5
      with:
        dotnet-version: 10.0.x
    - run: npm ci --include=optional
    - run: npm ci --prefix modules/pickup-agenda
    - run: python -m pip install -r modules/stockroom-reservations/requirements-dev.txt -r modules/pickup-agenda/requirements.txt
    - run: python scripts/verify-operations.py operations
  cashier:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    - uses: actions/setup-python@v7
      with:
        python-version: '3.12'
    - uses: actions/setup-dotnet@v5
      with:
        dotnet-version: 10.0.x
    - run: python -m pip install -r modules/float-plan/requirements.txt
    - run: python scripts/verify-operations.py cashier
  body-replay-replay:
    strategy:
      matrix:
        os:
        - ubuntu-latest
        - windows-latest
    runs-on: ${{ matrix.os }}
    steps:
    - uses: actions/checkout@v7
    - uses: actions/checkout@v7
      with:
        ref: d6d5139e2b4413fea49f83d15b3928c7e97be6da
        fetch-depth: 0
        path: modules/body-replay/stockroom-src
        persist-credentials: false
    - uses: actions/setup-python@v6
      with:
        python-version: '3.12'
    - run: python -m pip install -r requirements.txt -r stockroom-src/requirements-dev.txt
    - run: python -m unittest -v
    - run: python demo.py stockroom-src results
    defaults:
      run:
        working-directory: modules/body-replay
  commit-gap-crash:
    strategy:
      matrix:
        os:
        - ubuntu-latest
        - windows-latest
    runs-on: ${{ matrix.os }}
    steps:
    - uses: actions/checkout@v7
    - uses: actions/checkout@v7
      with:
        ref: 34165f1adceb2baceaa53997b7a79a86656e959b
        path: modules/commit-gap/stockroom-src
        fetch-depth: 0
        persist-credentials: false
    - uses: actions/setup-python@v6
      with:
        python-version: '3.12'
    - run: python -m pip install -r stockroom-src/requirements.txt
    - run: python drill.py stockroom-src
    defaults:
      run:
        working-directory: modules/commit-gap
  hold-model-replay:
    strategy:
      matrix:
        os:
        - ubuntu-latest
        - windows-latest
    runs-on: ${{ matrix.os }}
    steps:
    - uses: actions/checkout@v7
    - uses: actions/setup-python@v7
      with:
        python-version: '3.12'
    - uses: actions/checkout@v7
      with:
        ref: 34165f1adceb2baceaa53997b7a79a86656e959b
        path: modules/hold-model/stockroom-src
        persist-credentials: false
    - run: python -m pip install -r stockroom-src/requirements-dev.txt
    - run: python -m unittest -v
      env:
        STOCKROOM_SOURCE: stockroom-src
    - run: python check.py --seed 1 --runs 24 --steps 48
      env:
        STOCKROOM_SOURCE: stockroom-src
    defaults:
      run:
        working-directory: modules/hold-model
  stockroom-k8s-drill-rollout:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
    - uses: actions/checkout@v7
    - uses: actions/checkout@v7
      with:
        ref: 1bec99199cf0ee8ed9d9b3d34ddbaad10dc01930
        path: modules/stockroom-k8s-drill/app
        persist-credentials: false
    - name: Install pinned kind and kubectl
      shell: bash
      run: |
        mkdir "$RUNNER_TEMP/cluster-tools"
        cd "$RUNNER_TEMP/cluster-tools"
        curl --fail --location --retry 3 -o kind https://github.com/kubernetes-sigs/kind/releases/download/v0.33.0/kind-linux-amd64
        curl --fail --location --retry 3 -o kubectl https://dl.k8s.io/release/v1.37.0/bin/linux/amd64/kubectl
        echo 'aee6151561422756b764a4ae28e7f44cda5af5a9eead3cc9985112b1de8d8e0d  kind' | sha256sum -c -
        echo '6129359f4e1f3848a5572ccb0b26cf28b8ca08cef38c95a765b2f64a2c961a2f  kubectl' | sha256sum -c -
        chmod +x kind kubectl
        echo "$PWD" >> "$GITHUB_PATH"
    - name: Build, deploy, replace the pod and verify the reservation
      shell: bash
      run: |-
        python3 drill.py app > "$RUNNER_TEMP/result.json"
        cat "$RUNNER_TEMP/result.json"
        {
          echo '### Stockroom rollout evidence'
          echo '~~~json'
          cat "$RUNNER_TEMP/result.json"
          echo '~~~'
        } >> "$GITHUB_STEP_SUMMARY"
    defaults:
      run:
        working-directory: modules/stockroom-k8s-drill
  sqlite-recovery-drill-recovery:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os:
        - ubuntu-latest
        - windows-latest
        python:
        - '3.12'
        - '3.13'
    steps:
    - uses: actions/checkout@v7
    - uses: actions/setup-python@v7
      with:
        python-version: ${{ matrix.python }}
    - run: python -m unittest -v
    - uses: actions/checkout@v7
      with:
        ref: 1bec99199cf0ee8ed9d9b3d34ddbaad10dc01930
        path: modules/sqlite-recovery-drill/stockroom-checkout
        persist-credentials: false
    - run: python stockroom_drill.py stockroom-checkout
    - uses: actions/checkout@v7
      with:
        ref: 9e09bbd0e92ee666c4007f3a6fcfaae1b0bf9598
        path: modules/sqlite-recovery-drill/shift-vault-checkout
        persist-credentials: false
    - run: python vault_drill.py shift-vault-checkout
    - uses: actions/checkout@v7
      with:
        ref: 815888d38c9cd464dc455c2cb4fc7ec410be8fde
        path: modules/sqlite-recovery-drill/wal-lantern-checkout
        persist-credentials: false
    - uses: actions/setup-go@v5
      with:
        go-version-file: modules/sqlite-recovery-drill/wal-lantern-checkout/go.mod
        cache: false
    - run: go build -o ../wal-lantern.exe .
      working-directory: modules/sqlite-recovery-drill/wal-lantern-checkout
    - run: python incident_drill.py wal-lantern.exe
    defaults:
      run:
        working-directory: modules/sqlite-recovery-drill
  shift-vault-backup:
    strategy:
      matrix:
        os:
        - ubuntu-latest
        - windows-latest
    runs-on: ${{ matrix.os }}
    steps:
    - uses: actions/checkout@v7
    - uses: actions/setup-python@v6
      with:
        python-version: '3.12'
    - run: python -m unittest -v
    - run: python demo.py
    defaults:
      run:
        working-directory: modules/shift-vault
  wal-lantern-recover:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os:
        - ubuntu-latest
        - windows-latest
    steps:
    - uses: actions/checkout@v7
    - uses: actions/setup-go@v5
      with:
        go-version-file: modules/wal-lantern/go.mod
        cache: false
    - uses: actions/setup-python@v6
      with:
        python-version: '3.13'
    - run: go vet ./...
    - run: go build -o wal-lantern.exe .
    - run: python replay_demo.py wal-lantern.exe
    defaults:
      run:
        working-directory: modules/wal-lantern
  dock-outbox-receiving:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        engine:
        - chromium
        - firefox
    steps:
    - uses: actions/checkout@v7
    - uses: actions/setup-node@v7
      with:
        node-version: '24'
        cache: npm
        cache-dependency-path: modules/dock-outbox/package-lock.json
    - run: npm ci
    - run: npx playwright install --with-deps ${{ matrix.engine }}
    - run: npm test -- --project=${{ matrix.engine }}
    defaults:
      run:
        working-directory: modules/dock-outbox
  manifest-intake-transfer:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os:
        - ubuntu-latest
        - windows-latest
    steps:
    - uses: actions/checkout@v7
    - uses: actions/setup-python@v6
      with:
        python-version: '3.12'
    - run: 'python -m pip install --only-binary=:all: -r requirements.txt'
    - run: python -m grpc_tools.protoc -I . --python_out=. --grpc_python_out=. manifest.proto
    - run: python -m unittest -v
    - uses: actions/checkout@v7
      with:
        ref: 3ba0fc554334ed236300b66423e7c6301eb8fabd
        path: modules/manifest-intake/legacy
    - uses: actions/checkout@v7
      with:
        ref: a757e62362a9bab547c94fad8b5609be5adb8a37
        path: modules/manifest-intake/probe
    - run: python upgrade_demo.py legacy probe/probe.py
    defaults:
      run:
        working-directory: modules/manifest-intake
  proto-relay-probe-test:
    strategy:
      matrix:
        os:
        - ubuntu-latest
        - windows-latest
    runs-on: ${{ matrix.os }}
    steps:
    - uses: actions/checkout@v7
    - uses: actions/setup-python@v7
      with:
        python-version: '3.12'
        cache: pip
        cache-dependency-path: modules/proto-relay-probe/requirements.txt
    - run: python -m pip install -r requirements.txt
    - run: python -m unittest -v
    defaults:
      run:
        working-directory: modules/proto-relay-probe
  burn-pair-rules:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
        - os: ubuntu-latest
          binary: .tools/promtool
        - os: windows-latest
          binary: .tools/promtool.exe
    steps:
    - uses: actions/checkout@v7
    - uses: actions/setup-python@v6
      with:
        python-version: '3.12'
    - run: python install_promtool.py .tools
    - run: ${{ matrix.binary }} check rules rules.yml
    - run: python verify.py ${{ matrix.binary }}
    defaults:
      run:
        working-directory: modules/burn-pair
  stockroom-test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    - uses: actions/setup-python@v7
      with:
        python-version: '3.12'
    - run: pip install -r requirements-dev.txt
    - run: python -m pytest -q
    - run: docker build -t stockroom .
    - name: Exercise container
      run: |
        docker run -d --name stockroom -p 127.0.0.1:8000:8000 stockroom
        curl -fsS --retry 20 --retry-delay 1 --retry-all-errors http://127.0.0.1:8000/inventory -o /tmp/stockroom-inventory.json
        python -c "import json; assert json.load(open('/tmp/stockroom-inventory.json'))[0]['available']==20"
        python demo.py
        python demo.py --renew
        python demo.py --return-batch
        python demo.py --fulfill
        python demo.py --restock
        python demo.py --reduce
        python demo.py --packing
        python demo.py --batch
    - name: Show container logs on failure
      if: failure()
      run: docker logs stockroom
    - uses: actions/checkout@v7
      with:
        ref: 4da92c62b158b80f09f09285ce8e9a68e68d757a
        path: modules/stockroom-reservations/dock-checkout
        persist-credentials: false
    - uses: actions/setup-node@v7
      with:
        node-version: '24'
    - run: python dock_drill.py dock-checkout
    - uses: actions/checkout@v7
      with:
        ref: 3ba0fc554334ed236300b66423e7c6301eb8fabd
        path: modules/stockroom-reservations/intake-checkout
        persist-credentials: false
    - run: python -m pip install -r intake-checkout/requirements.txt
    - run: python manifest_drill.py intake-checkout
    - uses: actions/checkout@v7
      with:
        ref: 5f7840f82560aab18190b50fdb85a6ffc3aa475d
        path: modules/stockroom-reservations/slo-checkout
        persist-credentials: false
    - run: python slo-checkout/install_promtool.py .tools
    - run: python monitoring_drill.py .tools/promtool slo-checkout/rules.yml
    defaults:
      run:
        working-directory: modules/stockroom-reservations
  warehouse-pick-route-routes:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os:
        - ubuntu-latest
        - windows-latest
    steps:
    - uses: actions/checkout@v7
    - uses: actions/setup-python@v7
      with:
        python-version: '3.13'
    - run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
    - run: cmake --build build --config Release
    - run: ctest --test-dir build -C Release --output-on-failure
    - run: python -m pip install -r ../stockroom-reservations/requirements-dev.txt
    - run: python stockroom_demo.py build/pick-route
      if: runner.os == 'Linux'
    - run: python stockroom_demo.py build/Release/pick-route.exe
      if: runner.os == 'Windows'
    defaults:
      run:
        working-directory: modules/warehouse-pick-route
  coldroom-inbox-replay:
    strategy:
      matrix:
        os:
        - ubuntu-latest
        - windows-latest
    runs-on: ${{ matrix.os }}
    steps:
    - uses: actions/checkout@v7
    - uses: actions/setup-node@v6
      with:
        node-version: '26'
        cache: npm
        cache-dependency-path: modules/coldroom-inbox/package-lock.json
    - run: npm ci --no-audit --no-fund
    - run: npm test
    - run: npm run demo
    - uses: actions/setup-python@v7
      with:
        python-version: '3.12'
    - uses: actions/checkout@v7
      with:
        ref: 320c6586eaeb233e127ba999e5903f95d37fa38c
        path: modules/coldroom-inbox/legacy
    - uses: actions/checkout@v7
      with:
        ref: 8183b10d648d90f3cdc445298abb58e1a2ca560e
        path: modules/coldroom-inbox/thaw-window
    - run: node coverage-demo.mjs legacy/inbox.mjs thaw-window/thaw.py
    defaults:
      run:
        working-directory: modules/coldroom-inbox
  coldroom-inbox-thaw-window-test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os:
        - ubuntu-latest
        - windows-latest
    steps:
    - uses: actions/checkout@v7
    - uses: actions/setup-python@v7
      with:
        python-version: '3.12'
    - run: python -m unittest -v
    - run: python demo.py
    defaults:
      run:
        working-directory: modules/coldroom-inbox/modules/thaw-window
  count-relay-verify:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os:
        - ubuntu-latest
        - windows-latest
    steps:
    - uses: actions/checkout@v7
    - uses: actions/setup-python@v7
      with:
        python-version: '3.12'
    - run: python -m unittest -v
    - run: python demo.py
    - run: python demo_delta.py
    defaults:
      run:
        working-directory: modules/count-relay
  bay-signal-verify:
    strategy:
      matrix:
        os:
        - ubuntu-latest
        - windows-latest
    runs-on: ${{ matrix.os }}
    steps:
    - uses: actions/checkout@v7
    - uses: actions/setup-node@v6
      with:
        node-version: '24'
        cache: npm
        cache-dependency-path: modules/bay-signal/package-lock.json
    - run: npm ci
    - run: npm run check
    - run: npm test
    - run: npx playwright install --with-deps chromium
    - run: npm run test:browser
    defaults:
      run:
        working-directory: modules/bay-signal
  delivery-archive-archive:
    strategy:
      matrix:
        os:
        - ubuntu-latest
        - windows-latest
        python:
        - '3.12'
        - '3.13'
    runs-on: ${{ matrix.os }}
    steps:
    - uses: actions/checkout@v7
    - uses: actions/setup-python@v7
      with:
        python-version: ${{ matrix.python }}
    - run: python -m pip install -r requirements-test.txt
    - run: python -m unittest -v
    defaults:
      run:
        working-directory: modules/delivery-archive
  parcel-event-windows-stream:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os:
        - ubuntu-latest
        - windows-latest
        java:
        - '21'
        - '25'
    steps:
    - uses: actions/checkout@v7
    - uses: actions/setup-java@v6
      with:
        distribution: temurin
        java-version: ${{ matrix.java }}
    - uses: actions/setup-python@v7
      with:
        python-version: '3.13'
    - run: python -m unittest -v
    - run: python batch_demo.py
    - run: java src/ParcelWindows.java examples/scans.tsv
    - uses: actions/checkout@v7
      with:
        ref: fd2d41f4f732d0157c6fcf56571061604627e366
        path: modules/parcel-event-windows/legacy
    - run: python legacy_demo.py legacy
    defaults:
      run:
        working-directory: modules/parcel-event-windows
  track-thinner-verify:
    strategy:
      matrix:
        os:
        - ubuntu-latest
        - windows-latest
    runs-on: ${{ matrix.os }}
    steps:
    - uses: actions/checkout@v7
    - uses: actions/setup-python@v7
      with:
        python-version: '3.12'
    - run: python -m unittest -v
    - run: python thin.py examples/loading-bay.json --tolerance-mm 750 --split-gap-ms 1500
    defaults:
      run:
        working-directory: modules/track-thinner
  shelf-backtest-backtest:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os:
        - ubuntu-latest
        - windows-latest
    steps:
    - uses: actions/checkout@v7
    - uses: actions/setup-python@v7
      with:
        python-version: '3.12'
    - run: python -m unittest -v
    - run: python backtest.py examples/sales.csv --first 2026-06-15 --last 2026-06-18 --truth-as-of 2026-06-22 --details
    defaults:
      run:
        working-directory: modules/shelf-backtest
