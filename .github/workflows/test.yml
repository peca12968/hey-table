name: Verify cash handover
on: [push, pull_request]
permissions:
  contents: read
jobs:
  audit:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/checkout@v7
        with:
          repository: peca12968/till-change
          ref: 210ec2967f8c1394849fd68ae183c98d075ba9c8
          path: upstream
          persist-credentials: false
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: dotnet build upstream/TillChange.csproj -c Release
      - run: python -m unittest -v
        env:
          TILL_CHANGE_DLL: upstream/bin/Release/net10.0/TillChange.dll
      - run: python drawer.py examples/lunch.json examples/receipts.json examples/counts.json
