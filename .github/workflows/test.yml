name: Verify whole-batch kitchen planning
on: [push, pull_request]
permissions:
  contents: read
jobs:
  planning:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: python -m unittest -v
      - uses: actions/checkout@v7
        with:
          repository: peca12968/hey-table
          ref: e68aefb12e246058622861e04c7a1a0fa4495efc
          path: hey-table
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: hey-table/package-lock.json
      - run: npm ci --include=optional
        working-directory: hey-table
      - run: node kitchen-demo.mjs hey-table
