name: Verify Hei Ri restaurant and operations
on: [push, pull_request]
permissions:
  contents: read
jobs:
  ordering:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: npm ci --include=optional
      - run: node --test qa/tappay.test.mjs
      - run: npm run build
      - run: npm ci --prefix qa
      - run: npx playwright install --with-deps chromium
        working-directory: qa
      - run: npx playwright test
        working-directory: qa
      - run: python -m pip install -r modules/table-scan-check/requirements.txt
      - run: python scripts/verify-operations.py tables
  operations:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'
      - run: npm ci --include=optional
      - run: npm ci --prefix modules/pickup-agenda
      - run: python -m pip install -r modules/stockroom-reservations/requirements-dev.txt -r modules/pickup-agenda/requirements.txt
      - run: python scripts/verify-operations.py operations
  cashier:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'
      - run: python -m pip install -r modules/float-plan/requirements.txt
      - run: python scripts/verify-operations.py cashier
